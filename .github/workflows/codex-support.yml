name: Common skills and Codex adapters
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests
      - run: python gg-skills/hooks/guardrail.py --selftest
      - run: python gg-skills/hooks/secret_guard.py --selftest
      - run: python gg-skills/hooks/tdd_guard.py --selftest
      - run: python gg-skills/skills/engineering/onboard/scripts/check_setup.py --selftest
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: gg-skills/evals/behavior/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: gg-skills/evals/behavior
      - run: npm test -- --exclude test/goldenset.test.ts
        working-directory: gg-skills/evals/behavior
        env:
          EVAL_REPO: ${{ github.workspace }}
      - run: npx tsc --noEmit
        working-directory: gg-skills/evals/behavior
