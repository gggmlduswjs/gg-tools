# onboard 스킬이 점검할 대상 목록 — 단일 기준(single source of truth).
# 이 파일을 ~/.claude/onboard/sources.yaml 로 복사해 내 값으로 고친다(개인 경로가 들어가므로 공개 저장소에 올리지 않는다).
# 새 프로젝트·저장소·위키가 생기면 한 줄만 추가한다.
# 형식: 키 아래에 "- 값" 목록만 쓴다(주석은 # 로 시작).

structure_check: false   # true 면 projects 마다 구조 점검(문서 정리 후보)도 실행(--structure 와 같음)

projects:        # 내 로컬 프로젝트 폴더 (harness 틀로 만든 것)
  - ~/Desktop/my-project

repos:           # 접근할 수 있어야 하는 GitHub 저장소 (소유자/이름)
  - gggmlduswjs/gg-tools
  - gggmlduswjs/ai-dev-harness

wikis:           # 위키 폴더 (WIKI_SCHEMA.md 가 있는 곳)
  - ~/second-brain

docs:            # 위키 밖에 있는 정본 문서 폴더 (읽기 전용 참조)
  - ~/Documents/notes
