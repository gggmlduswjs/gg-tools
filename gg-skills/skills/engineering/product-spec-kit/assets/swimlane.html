<!-- 가로 스윔레인 렌더러 — 유저플로우 탭에 그대로 붙이고 LANES / N / E 세 배열만 갈아끼운다.
     좌표는 DOM 오프셋이 아니라 데이터로 계산한다(비활성 탭 display:none에서 offset=0).
     아래 데이터는 예시(월별 확인 콘솔)다. -->
      <div class="swim-bar">
        <button type="button" id="zOut" aria-label="축소">−</button>
        <span id="zVal">100%</span>
        <button type="button" id="zIn" aria-label="확대">+</button>
        <button type="button" id="zFit">폭 맞춤</button>
        <button type="button" id="zRst">100%</button>
      </div>
      <div class="swim-wrap" id="swimWrap">
        <div class="swim" id="swim" aria-label="월별 확인 콘솔 유저플로우 스윔레인"></div>
      </div>
      <div class="legend">
        <span><i style="background:#1e1c18"></i> 진입점</span>
        <span><i style="background:#33507a"></i> 화면/목록</span>
        <span><i style="background:#e4eaf3;border:1px solid #c4d1e6"></i> 화면 내 상태</span>
        <span><i style="background:#ffffff;border:1px solid #cfc9bc"></i> 단일 조작</span>
        <span><i style="background:#f5e1df;border:1px solid #b23b3b"></i> 되돌릴 수 없는 조작</span>
        <span style="margin-left:auto; color:var(--ink-faint); font-family:var(--mono); font-size:11px;">드래그로 이동 · Ctrl+휠 확대</span>
      </div>

      <style>
        /* 유저플로우 탭에서만 본문 폭 제한을 푼다 — 캔버스를 화면 끝까지 쓰려고 */
        main.wide{ max-width:none; }
        .swim-bar{ display:flex; align-items:center; gap:6px; margin-top:16px; }
        .swim-bar button{ all:unset; cursor:pointer; border:1px solid var(--line-strong); border-radius:5px;
          padding:3px 9px; font-size:11px; color:var(--ink-muted); background:var(--paper-raised); }
        .swim-bar button:hover{ color:var(--ink); border-color:var(--accent); }
        .swim-bar button:focus-visible{ outline:2px solid var(--accent); outline-offset:1px; }
        .swim-bar #zVal{ font-family:var(--mono); font-size:11px; color:var(--ink-faint);
          min-width:42px; text-align:center; font-variant-numeric:tabular-nums; }
        .swim-wrap{ border:1px solid var(--line); border-radius:10px; background:var(--paper-raised);
          overflow-x:auto; overflow-y:hidden; margin-top:8px; cursor:grab; }
        .swim-wrap.dragging{ cursor:grabbing; }
        .swim-wrap.dragging *{ user-select:none; }
        .swim{ position:relative; }
        .swim svg{ position:absolute; inset:0; overflow:visible; pointer-events:none; }
        .swim .swim-lane{ position:absolute; left:0; border-top:1px solid var(--line); }
        .swim .swim-lane-t{ position:absolute; left:14px; top:11px; width:124px;
          font-size:11.5px; line-height:1.3; color:var(--ink-muted); font-weight:600; }
        .swim .swim-lane-n{ display:block; font-family:var(--mono); font-size:9px;
          font-weight:400; color:var(--ink-faint); letter-spacing:.04em; margin-top:2px; word-break:break-all; }
        .swim .sn{ position:absolute; box-sizing:border-box; width:132px;
          display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
          padding:5px 8px; border-radius:6px; font-size:11.5px; line-height:1.28; z-index:2;
          border:1px solid var(--line-strong); background:var(--paper-raised); color:var(--ink); }
        .swim .sn small{ display:block; font-family:var(--mono); font-size:9px; color:var(--ink-faint); margin-top:2px; }
        .swim .sn.entry{ background:#1e1c18; color:#fff; border-color:#1e1c18; font-weight:600; }
        .swim .sn.screen{ background:var(--accent); color:#fff; border-color:var(--accent); font-weight:600; }
        .swim .sn.sub{ background:var(--accent-soft); color:var(--accent-ink); border-color:var(--accent-soft-line); }
        .swim .sn.sub small{ color:var(--accent-ink); }
        .swim .sn.danger{ background:var(--crit-soft); color:var(--crit); border-color:var(--crit); font-weight:600; }
        .swim .sn.danger small{ color:var(--crit); }
        .swim .sn.warn{ border-color:var(--warn); color:var(--warn); font-weight:600; }
      </style>

      <script>
      (function(){
        var LANES = [
          {t:'콘솔 진입 · 기간 조회', n:'/dashboard/month-check/'},
          {t:'확인 대상 게이트',       n:'scope_start_ym ~ scope_end_ym'},
          {t:'상태 탭 탐색',           n:'Alpine tab='},
          {t:'필터 · 결과 피드백',     n:'ag / rg / sc / q'},
          {t:'차이 조치 · 확인 후 변동', n:'month_check_apply_returns'},
          {t:'미확인 독촉 · 되돌리기',  n:'month_check_bulk'}
        ];
        var N = [
          {id:'enter', l:0,c:0,r:0,t:'entry', x:'콘솔 진입'},
          {id:'con',   l:0,c:1,r:0,t:'screen',x:'월별 확인 콘솔'},
          {id:'per',   l:0,c:2,r:0,t:'',      x:'조회 기간 선택', s:'start_ym ~ end_ym'},
          {id:'qry',   l:0,c:3,r:0,t:'',      x:'조회'},

          {id:'gate',  l:1,c:1,r:0,t:'screen',x:'게이트 설정 영역'},
          {id:'gsave', l:1,c:2,r:0,t:'',      x:'확인 대상 기간 저장'},
          {id:'gclr',  l:1,c:2,r:1,t:'',      x:'해제 — 과거월 전부'},
          {id:'gnow',  l:1,c:3,r:0,t:'sub',   x:'현재 적용 표시'},

          {id:'tbl',   l:2,c:1,r:0,t:'screen',x:'강사 목록 표'},
          {id:'t_all', l:2,c:2,r:0,t:'',      x:'전체'},
          {id:'t_pen', l:2,c:2,r:1,t:'',      x:'미확인'},
          {id:'t_par', l:2,c:2,r:2,t:'',      x:'부분확인'},
          {id:'t_dif', l:2,c:2,r:3,t:'warn',  x:'차이'},
          {id:'t_ful', l:2,c:2,r:4,t:'',      x:'완료'},
          {id:'t_rev', l:2,c:2,r:5,t:'',      x:'검토대기'},

          {id:'fbar',  l:3,c:2,r:0,t:'',      x:'업체·지역·학교·검색'},
          {id:'fchip', l:3,c:3,r:0,t:'sub',   x:'필터 칩', s:'표시 N / 전체 M'},
          {id:'fone',  l:3,c:4,r:0,t:'',      x:'칩 × 개별 해제'},
          {id:'fzero', l:3,c:3,r:1,t:'sub',   x:'표시 0명'},
          {id:'fall',  l:3,c:4,r:1,t:'',      x:'모두 해제'},

          {id:'dlist', l:4,c:3,r:0,t:'screen',x:'차이 대상 목록'},
          {id:'dopen', l:4,c:4,r:0,t:'',      x:'행 펼치기'},
          {id:'dcmp',  l:4,c:5,r:0,t:'sub',   x:'대조표', s:'시스템 ↔ 선생님'},
          {id:'dapp',  l:4,c:6,r:0,t:'danger',x:'적용 N', s:'되돌릴 수 없음'},
          {id:'ddone', l:4,c:7,r:0,t:'',      x:'거래내역에 반품 반영'},
          {id:'drift', l:4,c:4,r:1,t:'sub',   x:'확인 후 주문 변동'},
          {id:'dacc',  l:4,c:5,r:1,t:'',      x:'변동 반영'},
          {id:'drec',  l:4,c:5,r:2,t:'',      x:'재확인 요청'},

          {id:'plist', l:5,c:3,r:0,t:'screen',x:'미확인 대상 목록'},
          {id:'psms',  l:5,c:4,r:0,t:'',      x:'행 [문자] 1클릭'},
          {id:'psent', l:5,c:6,r:0,t:'sub',   x:'확인 안내문자 발송'},
          {id:'pchk',  l:5,c:4,r:1,t:'',      x:'전체선택 체크'},
          {id:'pbulk', l:5,c:5,r:1,t:'',      x:'선택 문자'},
          {id:'punl',  l:5,c:5,r:2,t:'',      x:'선택 잠금해제(예외)'},
          {id:'pback', l:5,c:4,r:2,t:'',      x:'되돌리기 → 미확인'}
        ];
        var E = [
          ['enter','con'],['con','per'],['per','qry'],['qry','tbl'],
          ['con','gate'],['gate','gsave'],['gate','gclr'],['gsave','gnow'],['gclr','gnow'],
          ['tbl','t_all'],['tbl','t_pen'],['tbl','t_par'],['tbl','t_dif'],['tbl','t_ful'],['tbl','t_rev'],
          ['tbl','fbar'],['fbar','fchip'],['fchip','fone'],['fbar','fzero'],['fzero','fall'],
          ['t_dif','dlist'],['t_rev','dlist'],['dlist','dopen'],['dopen','dcmp'],['dcmp','dapp'],['dapp','ddone'],
          ['t_ful','drift'],['drift','dacc'],['drift','drec'],
          ['t_pen','plist'],['t_par','plist'],
          ['plist','psms'],['psms','psent'],['plist','pchk'],['pchk','pbulk'],['pbulk','psent'],['pchk','punl'],
          ['t_ful','pback']
        ];

        var COL=172, ROW=52, PADL=152, LANEPAD=32, LANEBOT=14, NW=132;
        var root = document.getElementById('swim');
        if(!root) return;

        var rowsIn = [];
        N.forEach(function(n){ rowsIn[n.l] = Math.max(rowsIn[n.l]||0, n.r+1); });
        var top=[], y=0;
        LANES.forEach(function(_,i){ top[i]=y; y += LANEPAD + (rowsIn[i]||1)*ROW + LANEBOT; });
        var maxCol = N.reduce(function(m,n){ return Math.max(m,n.c); },0);
        var W = PADL + maxCol*COL + NW + 24, H = y;
        root.style.width = W+'px'; root.style.height = H+'px';

        var svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
        svg.setAttribute('width',W); svg.setAttribute('height',H);
        root.appendChild(svg);

        LANES.forEach(function(L,i){
          var h = LANEPAD + (rowsIn[i]||1)*ROW + LANEBOT;
          var band = document.createElement('div');
          band.className='swim-lane'; band.style.top=top[i]+'px';
          band.style.height=h+'px'; band.style.width=W+'px';
          if(i===0) band.style.borderTop='none';
          band.innerHTML='<div class="swim-lane-t">'+L.t+'<span class="swim-lane-n">'+L.n+'</span></div>';
          root.appendChild(band);
        });

        // 좌표는 DOM 오프셋이 아니라 데이터로 계산한다 —
        // 이 패널은 비활성일 때 display:none이라 offsetLeft/Top이 전부 0으로 나온다.
        var pos = {};
        N.forEach(function(n){
          var h = n.s ? 42 : 32;
          var nx = PADL + n.c*COL, ny = top[n.l] + LANEPAD + n.r*ROW;
          pos[n.id] = {x:nx, y:ny, w:NW, h:h};
          var d = document.createElement('div');
          d.className = 'sn'+(n.t?' '+n.t:'');
          d.style.left = nx+'px'; d.style.top = ny+'px'; d.style.height = h+'px';
          d.innerHTML = n.x + (n.s ? '<small>'+n.s+'</small>' : '');
          root.appendChild(d);
        });

        var stroke = getComputedStyle(document.documentElement).getPropertyValue('--line-strong').trim() || '#cfc9bc';
        E.forEach(function(e){
          var a=pos[e[0]], b=pos[e[1]]; if(!a||!b) return;
          var d;
          if(b.x >= a.x+a.w-1){
            var x1=a.x+a.w, y1=a.y+a.h/2, x2=b.x, y2=b.y+b.h/2, dx=Math.max(24,(x2-x1)/2);
            d='M'+x1+','+y1+' C'+(x1+dx)+','+y1+' '+(x2-dx)+','+y2+' '+x2+','+y2;
          } else {
            var cx1=a.x+a.w/2, cy1=a.y+a.h, cx2=b.x+b.w/2, cy2=b.y, dy=Math.max(18,(cy2-cy1)/2);
            d='M'+cx1+','+cy1+' C'+cx1+','+(cy1+dy)+' '+cx2+','+(cy2-dy)+' '+cx2+','+cy2;
          }
          var p=document.createElementNS('http://www.w3.org/2000/svg','path');
          p.setAttribute('d',d); p.setAttribute('fill','none');
          p.setAttribute('stroke',stroke); p.setAttribute('stroke-width','1');
          svg.appendChild(p);
        });

        // 유저플로우 탭이 켜져 있는 동안만 본문 폭 제한 해제.
        // 탭 전환 경로가 둘(사이드바 버튼·이전/다음)이라 클릭이 아니라 class 변화를 본다.
        var main = document.querySelector('main'), panel = document.getElementById('panel-flow');
        if(main && panel){
          var sync = function(){ main.classList.toggle('wide', panel.classList.contains('active')); };
          new MutationObserver(sync).observe(panel, {attributes:true, attributeFilter:['class']});
          sync();
        }

        // 줌 — transform은 레이아웃 크기를 안 바꾸니 래퍼 높이를 같이 준다
        var wrap = document.getElementById('swimWrap'), z=1;
        root.style.transformOrigin='0 0';
        function setZoom(v, anchorX){
          var prev=z; z=Math.min(2, Math.max(0.4, v));
          root.style.transform='scale('+z+')';
          wrap.style.height=(H*z+18)+'px';   // 가로 스크롤바 자리
          document.getElementById('zVal').textContent=Math.round(z*100)+'%';
          if(anchorX!=null){  // 커서 아래 지점을 고정한 채 확대
            wrap.scrollLeft = (wrap.scrollLeft+anchorX)*(z/prev) - anchorX;
          }
        }
        document.getElementById('zIn').onclick  = function(){ setZoom(z*1.15); };
        document.getElementById('zOut').onclick = function(){ setZoom(z/1.15); };
        document.getElementById('zRst').onclick = function(){ setZoom(1); wrap.scrollLeft=0; };
        document.getElementById('zFit').onclick = function(){ setZoom((wrap.clientWidth-2)/W); wrap.scrollLeft=0; };
        wrap.addEventListener('wheel', function(ev){
          if(!ev.ctrlKey) return;           // 그냥 휠은 페이지 스크롤 그대로 둔다
          ev.preventDefault();
          setZoom(z*(ev.deltaY<0?1.1:1/1.1), ev.clientX-wrap.getBoundingClientRect().left);
        }, {passive:false});
        setZoom(1);

        // 드래그로 좌우 이동 (피그마식 팬)
        var down=false, sx=0, sl=0;
        wrap.addEventListener('pointerdown', function(ev){
          if(ev.target.closest('.swim-bar')) return;
          down=true; sx=ev.clientX; sl=wrap.scrollLeft;
          wrap.classList.add('dragging'); wrap.setPointerCapture(ev.pointerId);
        });
        wrap.addEventListener('pointermove', function(ev){
          if(!down) return;
          wrap.scrollLeft = sl - (ev.clientX - sx);
        });
        ['pointerup','pointercancel'].forEach(function(t){
          wrap.addEventListener(t, function(){ down=false; wrap.classList.remove('dragging'); });
        });
      })();
      </script>
