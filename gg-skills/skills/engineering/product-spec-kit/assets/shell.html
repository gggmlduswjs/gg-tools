<!-- 4탭 기획 문서 껍데기. {{...}} 만 채우고 각 패널에 내용을 넣는다.
     유저플로우 패널에는 assets/swimlane.html 을, 기능명세서에는 assets/mindmap.html 을 통째로 붙인다. -->
<title>{{화면명}} — 기획 문서</title>
<style>
  :root{
    --paper:#f5f3ef; --paper-raised:#ffffff; --ink:#1e1c18; --ink-muted:#6b655c; --ink-faint:#9c9587;
    --line:#e1ddd4; --line-strong:#cfc9bc;
    --accent:#33507a; --accent-ink:#33507a; --accent-soft:#e4eaf3; --accent-soft-line:#c4d1e6;
    --good:#2f7a4d; --good-soft:#e3f1e7;
    --warn:#a3690f; --warn-soft:#f6ecd9;
    --crit:#b23b3b; --crit-soft:#f5e1df;
    --serif: Georgia, "Noto Serif KR", "Nanum Myeongjo", serif;
    --sans: -apple-system, BlinkMacSystemFont, "Pretendard Variable", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    --mono: ui-monospace, "SFMono-Regular", "JetBrains Mono", Consolas, monospace;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --paper:#17181b; --paper-raised:#1f2024; --ink:#ede9e2; --ink-muted:#9b968c; --ink-faint:#726d63;
      --line:#2c2d31; --line-strong:#3a3b40;
      --accent:#8fb0dc; --accent-ink:#a9c4e6; --accent-soft:#223247; --accent-soft-line:#31486a;
      --good:#6fbf8c; --good-soft:#1c2c22;
      --warn:#d9a94b; --warn-soft:#2e2617;
      --crit:#e08a8a; --crit-soft:#332020;
    }
  }
  :root[data-theme="dark"]{
    --paper:#17181b; --paper-raised:#1f2024; --ink:#ede9e2; --ink-muted:#9b968c; --ink-faint:#726d63;
    --line:#2c2d31; --line-strong:#3a3b40;
    --accent:#8fb0dc; --accent-ink:#a9c4e6; --accent-soft:#223247; --accent-soft-line:#31486a;
    --good:#6fbf8c; --good-soft:#1c2c22;
    --warn:#d9a94b; --warn-soft:#2e2617;
    --crit:#e08a8a; --crit-soft:#332020;
  }
  :root[data-theme="light"]{
    --paper:#f5f3ef; --paper-raised:#ffffff; --ink:#1e1c18; --ink-muted:#6b655c; --ink-faint:#9c9587;
    --line:#e1ddd4; --line-strong:#cfc9bc;
    --accent:#33507a; --accent-ink:#33507a; --accent-soft:#e4eaf3; --accent-soft-line:#c4d1e6;
    --good:#2f7a4d; --good-soft:#e3f1e7;
    --warn:#a3690f; --warn-soft:#f6ecd9;
    --crit:#b23b3b; --crit-soft:#f5e1df;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper); color:var(--ink); font-family:var(--sans);
    font-size:14px; line-height:1.6; -webkit-font-smoothing:antialiased;
  }
  ::selection{ background:var(--accent-soft); }

  .shell{ display:flex; min-height:100vh; }

  /* ── 사이드바 ── */
  .side{
    width:250px; flex:none; border-right:1px solid var(--line);
    padding:22px 18px; display:flex; flex-direction:column; gap:22px;
    position:sticky; top:0; height:100vh; overflow-y:auto;
  }
  .doc-meta .eyebrow{ font-family:var(--mono); font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-faint); }
  .doc-meta h1{ font-family:var(--serif); font-size:19px; line-height:1.35; margin:6px 0 8px; text-wrap:balance; font-weight:600; }
  .doc-meta .sub{ font-size:12px; color:var(--ink-muted); }
  .doc-status{ display:flex; align-items:center; gap:6px; margin-top:10px; font-size:11.5px; color:var(--ink-muted); }
  .dot{ width:6px; height:6px; border-radius:50%; background:var(--good); flex:none; }

  nav.tabs{ display:flex; flex-direction:column; gap:3px; }
  nav.tabs button{
    all:unset; cursor:pointer; padding:9px 10px; border-radius:6px; font-size:13px;
    display:flex; flex-direction:column; gap:2px; color:var(--ink-muted);
  }
  nav.tabs button .n{ font-family:var(--mono); font-size:10px; color:var(--ink-faint); }
  nav.tabs button:hover{ background:var(--accent-soft); color:var(--ink); }
  nav.tabs button.active{ background:var(--accent-soft); color:var(--accent-ink); font-weight:600; }
  nav.tabs button.active .n{ color:var(--accent-ink); }

  .side-foot{ margin-top:auto; font-size:11px; color:var(--ink-faint); border-top:1px solid var(--line); padding-top:12px; }

  /* ── 본문 ── */
  main{ flex:1; min-width:0; padding:38px 44px 80px; max-width:1040px; }
  .panel{ display:none; }
  .panel.active{ display:block; }

  .panel-head{ margin-bottom:28px; }
  .panel-head .eyebrow{ font-family:var(--mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-faint); }
  .panel-head h2{ font-family:var(--serif); font-size:28px; margin:6px 0 8px; text-wrap:balance; font-weight:600; }
  .panel-head p{ color:var(--ink-muted); max-width:66ch; margin:0; }

  h3.sec{ font-family:var(--serif); font-size:17px; font-weight:600; margin:36px 0 12px; padding-bottom:8px; border-bottom:1px solid var(--line); }
  h3.sec .tag{ font-family:var(--mono); font-size:10.5px; color:var(--ink-faint); font-weight:400; margin-left:8px; }

  p.body{ max-width:66ch; color:var(--ink); margin:0 0 12px; }
  p.body b{ color:var(--ink); }

  .callout{ border:1px solid var(--line); background:var(--paper-raised); border-radius:8px; padding:14px 16px; margin:14px 0; max-width:66ch; }
  .callout .k{ font-family:var(--mono); font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--accent-ink); margin-bottom:6px; display:block; }

  .kv{ display:grid; grid-template-columns:120px 1fr; gap:8px 16px; max-width:66ch; margin:14px 0; }
  .kv dt{ font-size:12px; color:var(--ink-faint); font-family:var(--mono); }
  .kv dd{ margin:0; }

  /* 스냅샷 스탯 타일 */
  .stat-row{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin:16px 0 6px; max-width:66ch; }
  .stat-tile{ border:1px solid var(--line); border-radius:8px; background:var(--paper-raised); padding:11px 13px; }
  .stat-tile .num{ font-family:var(--mono); font-size:20px; font-weight:700; font-variant-numeric:tabular-nums; }
  .stat-tile .lbl{ font-size:11px; color:var(--ink-muted); margin-top:2px; }
  .stat-tile.pending .num{ color:var(--ink-faint); }
  .stat-tile.confirmed .num{ color:var(--good); }
  .stat-tile.approved .num{ color:var(--accent-ink); }
  .stat-tile.review .num{ color:var(--warn); }
  .stat-note{ font-size:11px; color:var(--ink-faint); max-width:66ch; margin:0 0 12px; }

  /* 문제/해결 리스트 */
  .issue-list{ display:flex; flex-direction:column; gap:14px; margin:16px 0; }
  .issue{ display:grid; grid-template-columns:26px 1fr; gap:12px; border-bottom:1px dashed var(--line); padding-bottom:14px; }
  .issue:last-child{ border-bottom:none; }
  .issue .num{ font-family:var(--mono); font-size:12px; color:var(--ink-faint); padding-top:2px; }
  .issue .problem{ font-weight:600; margin-bottom:4px; }
  .issue .evidence{ font-size:12.5px; color:var(--ink-muted); margin-bottom:6px; }
  .issue .evidence code{ font-family:var(--mono); background:var(--paper); border:1px solid var(--line); border-radius:4px; padding:0 4px; font-size:11.5px; }
  .issue .fix{ font-size:13px; padding:8px 10px; background:var(--good-soft); border-radius:6px; color:var(--ink); }
  .issue .fix b{ color:var(--good); font-family:var(--mono); font-size:10.5px; text-transform:uppercase; letter-spacing:.04em; margin-right:6px; }

  .oos-grid{ display:grid; grid-template-columns:1fr 1fr; gap:16px; max-width:66ch; margin:14px 0; }
  @media (max-width:760px){ .oos-grid{ grid-template-columns:1fr; } }
  .oos-grid ul{ margin:0; padding-left:18px; font-size:12.5px; color:var(--ink-muted); }
  .oos-grid h5{ font-size:12px; margin:0 0 6px; color:var(--ink); }
  .oq{ display:flex; flex-direction:column; gap:8px; max-width:66ch; margin:14px 0; }
  .oq li{ font-size:12.5px; list-style:none; padding:8px 10px; border:1px dashed var(--line-strong); border-radius:6px; color:var(--ink-muted); }
  .oq li b{ color:var(--ink); font-weight:600; }

  /* 기능명세서 */
  .pri-matrix{ width:100%; border-collapse:collapse; margin:16px 0; font-size:12px; }
  .pri-matrix th{ text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.03em; color:var(--ink-faint); padding:7px 10px; border-bottom:1px solid var(--line-strong); }
  .pri-matrix td{ padding:8px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
  .pri-matrix td.id{ font-family:var(--mono); font-size:11px; color:var(--ink-faint); white-space:nowrap; }

  .req-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:16px; }
  @media (max-width:760px){ .req-grid{ grid-template-columns:1fr; } }
  .req-card{ border:1px solid var(--line); border-radius:10px; background:var(--paper-raised); padding:16px; }
  .req-card .rc-head{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:8px; }
  .req-card .rc-id{ font-family:var(--mono); font-size:11px; color:var(--ink-faint); }
  .pri{ font-family:var(--mono); font-size:10px; letter-spacing:.04em; text-transform:uppercase; padding:2px 7px; border-radius:999px; font-weight:600; }
  .pri.high{ background:var(--crit-soft); color:var(--crit); }
  .pri.mid{ background:var(--warn-soft); color:var(--warn); }
  .req-card h4{ font-size:14.5px; margin:0 0 8px; font-weight:600; }
  .req-card .desc{ font-size:12.5px; color:var(--ink-muted); margin-bottom:10px; }
  .req-card .ac{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:5px; }
  .req-card .ac li{ font-size:12px; padding-left:18px; position:relative; color:var(--ink); }
  .req-card .ac li::before{ content:"—"; position:absolute; left:0; color:var(--ink-faint); }
  .req-card .rc-foot{ margin-top:10px; padding-top:10px; border-top:1px solid var(--line); display:flex; flex-direction:column; gap:4px; }
  .req-card .rc-foot .row{ font-size:11px; color:var(--ink-faint); }
  .req-card .rc-foot .row b{ font-family:var(--mono); color:var(--ink-muted); font-weight:600; }
  .req-card .rc-foot .risk{ color:var(--warn); }

  /* 유저플로우 — 스윔레인 */
  .diagram-frame{ border:1px solid var(--line); border-radius:10px; background:var(--paper-raised); padding:20px; margin-top:16px; overflow-x:auto; }
  .legend{ display:flex; gap:18px; flex-wrap:wrap; margin-top:14px; font-size:12px; color:var(--ink-muted); }
  .legend span{ display:inline-flex; align-items:center; gap:6px; }
  .legend i{ width:10px; height:10px; border-radius:2px; display:inline-block; }

  /* 와이어프레임 */
  .browser{ border:1px solid var(--line-strong); border-radius:10px; overflow:hidden; margin-top:18px; background:var(--paper-raised); }
  .browser .chrome{ display:flex; align-items:center; gap:6px; padding:9px 12px; border-bottom:1px solid var(--line); background:var(--paper); }
  .browser .chrome .dots{ display:flex; gap:5px; }
  .browser .chrome .dots i{ width:9px; height:9px; border-radius:50%; background:var(--line-strong); }
  .browser .chrome .url{ font-family:var(--mono); font-size:11px; color:var(--ink-faint); background:var(--paper-raised); border:1px solid var(--line); border-radius:5px; padding:3px 10px; margin-left:8px; }

  .state-switch{ display:flex; gap:4px; padding:10px 18px 0; }
  .state-switch button{ all:unset; cursor:pointer; font-size:11.5px; padding:6px 12px; border-radius:6px 6px 0 0; color:var(--ink-muted); border:1px solid transparent; }
  .state-switch button.active{ background:var(--paper-raised); border-color:var(--line); border-bottom-color:var(--paper-raised); color:var(--accent-ink); font-weight:600; position:relative; top:1px; }

  .wf{ padding:16px 18px; font-size:12px; display:none; }
  .wf.active{ display:block; }
  .wf-title{ font-weight:700; font-size:14px; margin-bottom:10px; }
  .wf-row{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
  .chip{ font-size:11px; padding:4px 10px; border-radius:999px; border:1px solid var(--line); background:var(--paper); color:var(--ink-muted); cursor:default; }
  .chip.on{ background:var(--accent); color:#fff; border-color:var(--accent); font-weight:600; }
  .chip b{ font-family:var(--mono); margin-left:4px; }
  .active-filters{ display:flex; align-items:center; gap:8px; padding:7px 10px; background:var(--accent-soft); border:1px solid var(--accent-soft-line); border-radius:7px; font-size:11.5px; margin-bottom:10px; }
  .active-filters .f{ background:var(--paper-raised); border:1px solid var(--accent-soft-line); border-radius:999px; padding:2px 9px; display:inline-flex; align-items:center; gap:5px; }
  .active-filters .clear{ margin-left:auto; color:var(--accent-ink); font-weight:600; cursor:default; }

  .wf-table{ width:100%; border-collapse:collapse; }
  .wf-table th{ position:sticky; top:0; text-align:left; font-size:10.5px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.03em; padding:8px 8px; border-bottom:1px solid var(--line-strong); background:var(--paper-raised); }
  .wf-table td{ padding:9px 8px; border-bottom:1px solid var(--line); vertical-align:middle; }
  .wf-table tr.priority td{ background:var(--warn-soft); }
  .prio-badge{ font-family:var(--mono); font-size:9.5px; font-weight:700; padding:2px 6px; border-radius:4px; text-transform:uppercase; }
  .prio-badge.p1{ background:var(--crit); color:#fff; }
  .prio-badge.p2{ background:var(--warn); color:#241a06; }
  .badge{ font-size:10.5px; padding:2px 8px; border-radius:999px; font-weight:600; white-space:nowrap; }
  .badge.gray{ background:var(--line); color:var(--ink-muted); }
  .badge.good{ background:var(--good-soft); color:var(--good); }
  .badge.blue{ background:var(--accent-soft); color:var(--accent-ink); }
  .badge.warn{ background:var(--warn-soft); color:var(--warn); }
  .wf-btn{ font-size:11px; padding:4px 10px; border-radius:6px; border:1px solid var(--line-strong); background:var(--paper); color:var(--ink); }
  .wf-btn.primary{ background:var(--accent); border-color:var(--accent); color:#fff; }

  .gate-panel{ border:1px dashed var(--line-strong); border-radius:8px; padding:10px 12px; margin-top:14px; font-size:11.5px; color:var(--ink-muted); display:flex; justify-content:space-between; align-items:center; }
  .gate-panel .expand{ font-family:var(--mono); font-size:10.5px; color:var(--accent-ink); }
  .gate-open{ border:1px solid var(--accent-soft-line); border-radius:8px; padding:14px; margin-top:14px; background:var(--accent-soft); }
  .gate-open .gt{ font-weight:700; font-size:12.5px; margin-bottom:10px; }
  .gate-open .grow{ display:flex; align-items:center; justify-content:space-between; padding:8px 0; border-top:1px solid var(--accent-soft-line); font-size:11.5px; }
  .gate-open .grow:first-of-type{ border-top:none; }

  .empty-state{ text-align:center; padding:48px 20px; color:var(--ink-muted); }
  .empty-state .ico{ font-family:var(--mono); font-size:22px; color:var(--ink-faint); margin-bottom:8px; }
  .empty-state .msg{ font-weight:600; color:var(--ink); margin-bottom:4px; }
  .empty-state .sub{ font-size:11.5px; margin-bottom:14px; }

  .cmp-box{ border:1px solid var(--line); border-radius:8px; margin-top:8px; padding:12px; background:var(--paper); }
  .cmp-box h5{ font-size:11.5px; margin:0 0 8px; color:var(--ink-muted); }
  .cmp-table{ width:100%; border-collapse:collapse; font-size:11px; }
  .cmp-table th,.cmp-table td{ border:1px solid var(--line); padding:4px 7px; text-align:center; }
  .cmp-table th{ background:var(--paper-raised); font-size:10px; }
  .cmp-table th.sys{ background:var(--accent-soft); color:var(--accent-ink); }
  .cmp-table th.cfm{ background:var(--warn-soft); color:var(--warn); }
  .cmp-table td.bk{ text-align:left; }
  .cmp-table td.warn{ background:var(--crit-soft); color:var(--crit); font-weight:700; }

  .callout-tag{ display:inline-flex; align-items:center; justify-content:center; width:16px; height:16px; border-radius:50%; background:var(--accent); color:#fff; font-family:var(--mono); font-size:10px; font-weight:700; margin-right:5px; flex:none; }

  .annot-list{ display:flex; flex-direction:column; gap:10px; margin-top:16px; }
  .annot{ display:grid; grid-template-columns:22px 1fr; gap:10px; font-size:12.5px; }
  .annot b{ font-family:var(--mono); }
  .annot .before{ color:var(--ink-faint); text-decoration:line-through; margin-right:4px; }
  .annot .after{ color:var(--good); }

  .foot-nav{ display:flex; justify-content:space-between; margin-top:44px; padding-top:18px; border-top:1px solid var(--line); font-size:12px; }
  .foot-nav button{ all:unset; cursor:pointer; color:var(--accent-ink); font-weight:600; }
  .foot-nav button:hover{ text-decoration:underline; }

  @media (prefers-reduced-motion: no-preference){
    .panel.active{ animation:fade .18s ease-out; }
  }
  @keyframes fade{ from{ opacity:0; transform:translateY(2px);} to{ opacity:1; transform:none; } }
</style>

<div class="shell">
  <aside class="side">
    <div class="doc-meta">
      <div class="eyebrow">bookmart · orders/dashboard</div>
      <h1>{{화면명}}</h1>
      <div class="sub">{{URL}} — {{한 줄 정의}}</div>
      <div class="doc-status"><span class="dot"></span> v1 · {{날짜}} origin/main 현행 기준</div>
    </div>
    <nav class="tabs" id="tabs">
      <button class="active" data-panel="prd"><span>PRD</span><span class="n">현행 구성 · 남은 문제</span></button>
      <button data-panel="spec"><span>기능명세서</span><span class="n">남은 문제 5건 · 구현 순서</span></button>
      <button data-panel="flow"><span>유저플로우</span><span class="n">6개 레인 · 팬/줌</span></button>
      <button data-panel="wireframe"><span>와이어프레임</span><span class="n">현행 4종 · 변경 지점</span></button>
    </nav>
    <div class="side-foot">근거: origin/main — {{읽은 파일 경로들}}</div>
  </aside>

  <main>
    <!-- ══════════ PRD ══════════ -->
    <section class="panel active" id="panel-prd">
      <div class="panel-head">
        <div class="eyebrow">Product Requirements</div>
        <h2>PRD</h2>
        <p>{{한 줄 설명}}</p>
      </div>
      <!-- 개요·현행·문제·타겟·범위밖·열린질문·지표 — h3.sec / .kv / .callout / .issue-list / .oq 재사용 -->
    </section>

    <!-- ══════════ 기능명세서 ══════════ -->
    <section class="panel" id="panel-spec">
      <div class="panel-head">
        <div class="eyebrow">Functional Spec</div>
        <h2>기능명세서</h2>
        <p>{{한 줄 설명}}</p>
      </div>
      <!-- ① assets/mindmap.html 트리 ② .pri-matrix 표 ③ .req-grid 요구사항 카드 -->
    </section>

    <!-- ══════════ 유저플로우 ══════════ -->
    <section class="panel" id="panel-flow">
      <div class="panel-head">
        <div class="eyebrow">User Flow</div>
        <h2>유저플로우</h2>
        <p>{{한 줄 설명}}</p>
      </div>
      <!-- assets/swimlane.html 통째 삽입 후 LANES/N/E 만 교체 -->
    </section>

    <!-- ══════════ 와이어프레임 ══════════ -->
    <section class="panel" id="panel-wireframe">
      <div class="panel-head">
        <div class="eyebrow">Wireframe</div>
        <h2>와이어프레임</h2>
        <p>{{한 줄 설명}}</p>
      </div>
      <!-- .browser + .state-switch 로 화면 상태 3~5종 + .annot-list 변경 로그 -->
    </section>

    <div class="foot-nav">
      <button onclick="go(-1)">← 이전</button>
      <button onclick="go(1)">다음 →</button>
    </div>
  </main>
</div>

<script>
  const order = ['prd','spec','flow','wireframe'];
  const buttons = document.querySelectorAll('#tabs button');
  function show(name){
    document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.id === 'panel-' + name));
    buttons.forEach(b => b.classList.toggle('active', b.dataset.panel === name));
  }
  buttons.forEach(b => b.addEventListener('click', () => show(b.dataset.panel)));
  function go(delta){
    const active = document.querySelector('.panel.active').id.replace('panel-','');
    const idx = order.indexOf(active);
    const next = order[Math.min(order.length - 1, Math.max(0, idx + delta))];
    show(next);
  }

  const wfButtons = document.querySelectorAll('#wfSwitch button');
  wfButtons.forEach(b => b.addEventListener('click', () => {
    document.querySelectorAll('.wf').forEach(w => w.classList.toggle('active', w.id === 'wf-' + b.dataset.wf));
    wfButtons.forEach(x => x.classList.toggle('active', x === b));
  }));
</script>
